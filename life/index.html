<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生活 · 杂记</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  /* 归档页专属 — 金色主题 */
  .archive-hero {
    padding: 100px 64px 60px; text-align: center;
    background: linear-gradient(to bottom, rgba(184,134,11,0.06) 0%, transparent 100%);
  }
  .archive-eyebrow {
    font-size: 10px; letter-spacing: 6px; color: var(--gold);
    text-transform: uppercase; margin-bottom: 14px;
    font-family: 'JetBrains Mono', monospace;
  }
  .archive-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(26px, 4vw, 40px); font-weight: 700;
    color: var(--text-primary); letter-spacing: 1px; margin-bottom: 10px;
  }
  .archive-count {
    font-size: 12px; color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace; letter-spacing: 2px;
  }
  .archive-content { max-width: 800px; margin: 0 auto; padding: 0 24px 80px; }
  .year-divider {
    display: flex; align-items: center; gap: 16px;
    margin: 48px 0 24px; padding: 0 8px;
  }
  .year-divider:first-of-type { margin-top: 0; }
  .year-label {
    font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700;
    color: var(--text-primary); letter-spacing: 2px; white-space: nowrap;
  }
  .year-line { flex: 1; height: 1px; background: var(--border); }
  .post-card {
    display: grid; grid-template-columns: 80px 1fr auto;
    gap: 20px; align-items: center; padding: 20px 12px;
    text-decoration: none; border-bottom: 1px solid var(--border);
    border-left: 3px solid transparent; transition: background .15s, border-color .15s;
  }
  .post-card:hover { background: rgba(184,134,11,0.04); border-left-color: var(--gold); }
  .post-date {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-muted); text-align: center; line-height: 1.6;
  }
  .post-date .day { display: block; font-size: 22px; font-weight: 600; color: var(--text-primary); }
  .post-info { min-width: 0; }
  .post-tag {
    font-size: 10px; letter-spacing: 2px; color: var(--gold);
    text-transform: uppercase; margin-bottom: 4px;
    font-family: 'JetBrains Mono', monospace;
  }
  .post-name {
    font-size: 15px; color: var(--text-primary); font-weight: 600;
    margin-bottom: 6px; line-height: 1.4;
  }
  .post-desc { font-size: 12px; color: var(--text-muted); line-height: 1.7; }
  .post-arrow { font-size: 16px; color: var(--border-accent); transition: color .2s; }
  .post-card:hover .post-arrow { color: var(--gold); }
  .back-link {
    display: inline-block; margin-bottom: 32px; font-size: 12px;
    color: var(--text-muted); text-decoration: none;
    font-family: 'JetBrains Mono', monospace; transition: color .2s;
  }
  .back-link:hover { color: var(--gold); }
  @media (max-width: 768px) {
    .archive-hero { padding: 80px 24px 40px; }
    .archive-content { padding: 0 16px 60px; }
    .post-card { grid-template-columns: 1fr; gap: 6px; }
    .post-date { text-align: left; }
    .post-date .day { display: inline; font-size: inherit; }
    .post-arrow { display: none; }
  }
</style>
</head>
<body>

<div id="header-placeholder"></div>

<section class="archive-hero fade-in">
  <p class="archive-eyebrow">Life</p>
  <h1 class="archive-title">生活杂记</h1>
  <p class="archive-count" data-i18n="life_count">共 2 篇文章</p>
</section>

<div class="archive-content fade-in">
  <a class="back-link" href="../index.html#life" data-i18n="back_home">← 返回主页</a>

  <!-- 2026 年 -->
  <div class="year-divider">
    <span class="year-label">2026</span>
    <div class="year-line"></div>
  </div>

  <a href="movie.html" class="post-card">
    <div class="post-date"><span class="day">25</span>7月</div>
    <div class="post-info">
      <p class="post-tag" data-i18n="life_movie_tag">电影</p>
      <p class="post-name" data-i18n="life_movie_title">讲一讲我看过的电影吧</p>
      <p class="post-desc" data-i18n="life_movie_desc">给大家聊一聊以前看过的电影。</p>
    </div>
    <div class="post-arrow">→</div>
  </a>

  <a href="think2026_7_23.html" class="post-card">
    <div class="post-date"><span class="day">25</span>7月</div>
    <div class="post-info">
      <p class="post-tag" data-i18n="life_think_tag">随笔</p>
      <p class="post-name" data-i18n="life_think_title">买了一个拇指相机</p>
      <p class="post-desc" data-i18n="life_think_desc">终于买了想要很久的拇指相机。</p>
    </div>
    <div class="post-arrow">→</div>
  </a>

</div>

<div id="footer-placeholder"></div>

<script src="../lang.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
