<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="blogX_title"><!-- 博文标题 --></title>
<link rel="stylesheet" href="../css/style.css">
<!-- KaTeX 数学公式 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>
<body>

<div id="header-placeholder"></div>

<section class="section-wrap fade-in" style="margin-top: 60px;">
  <div class="section-header">
    <p class="section-label" data-i18n="blogX_tag"><!-- 分类标签 --></p>
    <h1 class="section-title" data-i18n="blogX_title"><!-- 标题 --></h1>
  </div>
  <div class="article-content">

    <!--
    ╔══════════════════════════════════════════╗
    ║  正文支持：                             ║
    ║  · <strong>加粗</strong>                ║
    ║  · <code>行内代码</code>               ║
    ║  · 图片：<img src="图片路径" alt="">   ║
    ║  · 行内公式：$E = mc^2$               ║
    ║  · 块级公式：$$ \int_a^b f(x)dx $$    ║
    ╚══════════════════════════════════════════╝
    -->

    <p data-i18n="blogX_body_p1">第一段正文。</p>

    <!-- 图片示例：
    <p><img src="../images/example.jpg" alt="图片说明" style="max-width:100%;border-radius:4px;"></p>
    -->

    <p data-i18n="blogX_body_p2">第二段正文，可以包含行内公式 $O(n \log n)$。</p>

    <!-- 块级公式示例：
    <p>$$ \text{Attention}(Q, K, V) = \text{softmax}\left(\frac{QK^T}{\sqrt{d_k}}\right)V $$</p>
    -->

    <p data-i18n="blogX_body_p3">第三段正文。</p>

  </div>
</section>

<div id="footer-placeholder"></div>

<script src="../lang.js"></script>
<script src="../js/app.js"></script>
<!-- KaTeX 自动渲染 -->
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});">
</script>
</body>
</html>
