<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="blog_title">技术博客</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  /* 归档页专属 */
  .archive-hero {
    padding: 100px 64px 60px; text-align: center;
    background: linear-gradient(to bottom, var(--accent-light) 0%, transparent 100%);
  }
  .archive-eyebrow {
    font-size: 10px; letter-spacing: 6px; color: var(--accent);
    text-transform: uppercase; margin-bottom: 14px;
    font-family: 'JetBrains Mono', monospace;
  }
  .archive-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(26px, 4vw, 40px); font-weight: 700;
    color: var(--text-primary); letter-spacing: 1px; margin-bottom: 10px;
  }
  .archive-count {
    font-size: 12px; color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace; letter-spacing: 2px;
  }
  .archive-content { max-width: 800px; margin: 0 auto; padding: 0 24px 80px; }
  .year-divider {
    display: flex; align-items: center; gap: 16px;
    margin: 48px 0 24px; padding: 0 8px;
  }
  .year-divider:first-of-type { margin-top: 0; }
  .year-label {
    font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700;
    color: var(--text-primary); letter-spacing: 2px; white-space: nowrap;
  }
  .year-line { flex: 1; height: 1px; background: var(--border); }
  .post-card {
    display: grid; grid-template-columns: 80px 1fr auto;
    gap: 20px; align-items: center; padding: 20px 12px;
    text-decoration: none; border-bottom: 1px solid var(--border);
    transition: background .15s;
  }
  .post-card:hover { background: var(--accent-light); }
  .post-date {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-muted); text-align: center; line-height: 1.6;
  }
  .post-date .day { display: block; font-size: 22px; font-weight: 600; color: var(--text-primary); }
  .post-info { min-width: 0; }
  .post-tag {
    font-size: 10px; letter-spacing: 2px; color: var(--accent);
    text-transform: uppercase; margin-bottom: 4px;
    font-family: 'JetBrains Mono', monospace;
  }
  .post-name {
    font-size: 15px; color: var(--text-primary); font-weight: 600;
    margin-bottom: 6px; line-height: 1.4;
  }
  .post-desc { font-size: 12px; color: var(--text-muted); line-height: 1.7; }
  .post-tech { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .post-tech span {
    font-size: 9px; letter-spacing: 1px; color: var(--accent);
    background: var(--accent-light); border: 1px solid rgba(0,102,204,0.15);
    padding: 2px 8px; text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
  }
  .post-arrow { font-size: 16px; color: var(--border-accent); transition: color .2s; }
  .post-card:hover .post-arrow { color: var(--accent); }
  .back-link {
    display: inline-block; margin-bottom: 32px; font-size: 12px;
    color: var(--text-muted); text-decoration: none;
    font-family: 'JetBrains Mono', monospace; transition: color .2s;
  }
  .back-link:hover { color: var(--accent); }
  @media (max-width: 768px) {
    .archive-hero { padding: 80px 24px 40px; }
    .archive-content { padding: 0 16px 60px; }
    .post-card { grid-template-columns: 1fr; gap: 6px; }
    .post-date { text-align: left; }
    .post-date .day { display: inline; font-size: inherit; }
    .post-arrow { display: none; }
  }
</style>
</head>
<body>

<div id="header-placeholder"></div>

<section class="archive-hero fade-in">
  <p class="archive-eyebrow" data-i18n="blog_label">Blog</p>
  <h1 class="archive-title" data-i18n="blog_title">技术博客</h1>
  <p class="archive-count" data-i18n="blog_count">共 2 篇文章</p>
</section>

<div class="archive-content fade-in">
  <a class="back-link" href="../index.html#blog" data-i18n="back_home">← 返回主页</a>

  <!-- 2026 年 -->
  <div class="year-divider">
    <span class="year-label">2026</span>
    <div class="year-line"></div>
  </div>

  <a href="blog1.html" class="post-card">
    <div class="post-date"><span class="day">15</span>7月</div>
    <div class="post-info">
      <p class="post-tag" data-i18n="blog1_tag">系统 · 随笔</p>
      <p class="post-name" data-i18n="blog1_title">硬件解耦与大模型推理的思考</p>
      <p class="post-desc" data-i18n="blog1_desc">记录我对硬件解耦、内存池化、RDMA 加速 LLM 推理的理解与实践。</p>
      <div class="post-tech">
        <span>Systems</span><span>LLM</span><span>RDMA</span>
      </div>
    </div>
    <div class="post-arrow">→</div>
  </a>

  <a href="blog2.html" class="post-card">
    <div class="post-date"><span class="day">20</span>7月</div>
    <div class="post-info">
      <p class="post-tag" data-i18n="blog2_tag">学习 · 笔记</p>
      <p class="post-name" data-i18n="blog2_title">操作系统学习笔记：调度与虚拟化</p>
      <p class="post-desc" data-i18n="blog2_desc">整理调度器、内存管理、系统虚拟化的核心知识点与实现思路。</p>
      <div class="post-tech">
        <span>OS</span><span>Scheduler</span><span>Virtualization</span>
      </div>
    </div>
    <div class="post-arrow">→</div>
  </a>

</div>

<div id="footer-placeholder"></div>

<script src="../lang.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
